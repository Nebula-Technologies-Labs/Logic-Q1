info:
  name: Get Contacts By Organization
  type: http
  seq: 3
  tags:
    - Contacts

http:
  method: GET
  url: "{{baseUrl}}/contact/org/:orgId/"
  params:
    - name: orgId
      value: "{{orgId}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
