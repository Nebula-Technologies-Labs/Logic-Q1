info:
  name: Get Contact By Id
  type: http
  seq: 4
  tags:
    - Contacts

http:
  method: GET
  url: "{{baseUrl}}/contact/:id"
  params:
    - name: id
      value: "{{contactId}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
