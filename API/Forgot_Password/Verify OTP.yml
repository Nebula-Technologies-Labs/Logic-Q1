info:
  name: Verify OTP
  type: http
  seq: 2
  tags:
    - Forgot_Password

http:
  method: POST
  url: "{{baseUrl}}/forgotPassword/verifyOTP/:email/:otp"
  params:
    - name: email
      value: john.doe@example.com
      type: path
    - name: otp
      value: "123456"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
