info:
  name: Change Password
  type: http
  seq: 3
  tags:
    - Forgot_Password

http:
  method: POST
  url: "{{baseUrl}}/forgotPassword/changePassword/:email"
  params:
    - name: email
      value: john.doe@example.com
      type: path
  body:
    type: json
    data: |-
      {
        "password": "newPassword123",
        "repeatPassword": "newPassword123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
