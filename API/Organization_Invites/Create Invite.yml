info:
  name: Create Invite
  type: http
  seq: 1
  tags:
    - Organization_Invites

http:
  method: POST
  url: "{{baseUrl}}/api/organization/invites"
  body:
    type: json
    data: |-
      {
        "email": "newmember@example.com",
        "roleId": "{{roleId}}"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
