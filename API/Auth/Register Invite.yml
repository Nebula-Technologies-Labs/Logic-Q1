info:
  name: Register Invite
  type: http
  seq: 3
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/auth/register-invite"
  body:
    type: json
    data: |-
      {
        "token": "{{inviteToken}}",
        "firstName": "Jane",
        "lastName": "Doe",
        "password": "password123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
