info:
  name: Update User
  type: http
  seq: 2
  tags:
    - Users

http:
  method: PUT
  url: "{{baseUrl}}/api/users/:id"
  params:
    - name: id
      value: "{{userId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "firstName": "John",
        "lastName": "Doe",
        "phoneNumber": "+1234567890",
        "jobTitle": "Engineer",
        "department": "Engineering"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
