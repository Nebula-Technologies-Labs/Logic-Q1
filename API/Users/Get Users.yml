info:
  name: Get Users
  type: http
  seq: 3
  tags:
    - Users

http:
  method: GET
  url: "{{baseUrl}}/api/users"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
