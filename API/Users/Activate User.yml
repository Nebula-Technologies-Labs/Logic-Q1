info:
  name: Activate User
  type: http
  seq: 4
  tags:
    - Users

http:
  method: PATCH
  url: "{{baseUrl}}/api/users/:id/activate"
  params:
    - name: id
      value: "{{userId}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
