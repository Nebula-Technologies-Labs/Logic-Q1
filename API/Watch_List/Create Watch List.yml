info:
  name: Create Watch List
  type: http
  seq: 1
  tags:
    - Watch_List

http:
  method: POST
  url: "{{baseUrl}}/api/watchList/create"
  body:
    type: json
    data: |-
      {
        "name": "VIP Clients",
        "email": "vip@example.com",
        "phoneNumber": "+1987654321"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
