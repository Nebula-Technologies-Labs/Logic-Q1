info:
  name: Delete Watch List
  type: http
  seq: 3
  tags:
    - Watch_List

http:
  method: POST
  url: "{{baseUrl}}/api/watchList/delete/:id"
  params:
    - name: id
      value: "{{watchListId}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
