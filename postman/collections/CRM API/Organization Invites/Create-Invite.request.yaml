$kind: http-request
name: Create Invite
method: POST
url: '{{baseUrl}}/api/organization/invites'
order: 1000
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "email": "newmember@example.com",
      "roleId": "{{roleId}}"
    }
