$kind: http-request
name: Create Watch List
method: POST
url: '{{baseUrl}}/api/watchList/create'
order: 1000
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "name": "VIP Clients",
      "email": "vip@example.com",
      "phoneNumber": "+1987654321"
    }
