$kind: http-request
name: Create Organization
method: POST
url: '{{baseUrl}}/organization/create'
order: 1000
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "name": "Acme Corp",
      "category": "Technology",
      "country": "US",
      "websiteUrl": "https://acme.com"
    }
