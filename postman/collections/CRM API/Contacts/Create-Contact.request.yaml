$kind: http-request
name: Create Contact
method: POST
url: '{{baseUrl}}/contact/create'
order: 1000
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "email": "contact@example.com",
      "name": "Alice Smith",
      "phoneNumber": "+1234567890",
      "secondaryEmail": "alice.alt@example.com",
      "description": "Key client",
      "note": "Met at conference",
      "title": "CEO",
      "department": "Executive",
      "contactSource": "Website",
      "country": "US",
      "city": "New York",
      "state": "NY"
    }
