spring.application.name=crm


# Database Connection Configuration
spring.datasource.url=jdbc:postgresql://${LOCAL_DB_HOST}:${LOCAL_DB_PORT}/${LOCAL_DB_NAME}
spring.datasource.username=${LOCAL_DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# SQL Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true


# Google OAuth Configuration

spring.security.oauth2.client.registration.google.client-id=${LOCAL_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${LOCAL_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/auth/callback/google


jwt.secret=${LOCAL_JWT_SECRET}

#mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${LOCAL_EMAIL_USERNAME}
spring.mail.password=${LOCAL_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

#flyway
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://${LOCAL_DB_HOST}:${LOCAL_DB_PORT}/${LOCAL_DB_NAME}
spring.flyway.user=${LOCAL_DB_USERNAME}
spring.flyway.password=${LOCAL_DB_PASSWORD}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

app.frontend-url=${local_FRONTEND_URL}

logging.level.org.springframework.security= debug
logging.level.org.springframework.security.oauth2= debug
