spring.application.name=crm

# Database Connection Configuration
spring.datasource.url=jdbc:postgresql://${PROD_DB_HOST}:${PROD_DB_PORT}/${PROD_DB_NAME}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=3210

# SQL Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Google OAuth Configuration
spring.security.oauth2.client.registration.google.client-id=${PROD_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${PROD_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

jwt.secret=${PROD_JWT_SECRET}

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${PROD_EMAIL_USERNAME}
spring.mail.password=${PROD_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always