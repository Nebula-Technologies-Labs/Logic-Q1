services:

  crm-backend:

    build: .

    container_name: crm-backend

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

    env_file:
      - .env

    ports:
      - "3210:8080"

    networks:
      - logicq1-network

networks:
  logicq1-network:
    external: true