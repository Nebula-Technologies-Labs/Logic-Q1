services:

  crm-backend:
    build: .

    container_name: crm-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod

    ports:
      - "127.0.0.1:3210:3210"

    networks:
      - logicq1-network

networks:

  logicq1-network:
    external: true
